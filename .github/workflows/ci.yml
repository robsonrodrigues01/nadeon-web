name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Data check
        run: pnpm data:check

      - name: Build
        run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Audit dependencies
        run: pnpm security:audit

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      deployments: read
      statuses: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Wait for Vercel preview deployment
        id: wait_preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Aguardando URL de previa da Vercel para o commit $COMMIT_SHA..."
          PREVIEW_URL=""
          for i in $(seq 1 30); do
            PREVIEW_URL=$(gh api "repos/${{ github.repository }}/deployments?sha=${COMMIT_SHA}" --jq '.[0].environment_url // empty' 2>/dev/null || true)
            if [ -z "$PREVIEW_URL" ]; then
              DEP_ID=$(gh api "repos/${{ github.repository }}/deployments?sha=${COMMIT_SHA}" --jq '.[0].id // empty' 2>/dev/null || true)
              if [ -n "$DEP_ID" ]; then
                PREVIEW_URL=$(gh api "repos/${{ github.repository }}/deployments/${DEP_ID}/statuses" --jq '.[] | select(.state=="success") | .environment_url // .target_url' 2>/dev/null | head -n1 || true)
              fi
            fi
            if [ -z "$PREVIEW_URL" ]; then
              PREVIEW_URL=$(gh api "repos/${{ github.repository }}/statuses/${COMMIT_SHA}" --jq '.[] | select(.context | test("(?i)vercel")) | select(.state=="success") | .target_url' 2>/dev/null | head -n1 || true)
            fi
            if [ -n "$PREVIEW_URL" ]; then
              echo "URL da previa localizada: $PREVIEW_URL"
              echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Previa ainda nao disponivel (tentativa $i/30). Aguardando 10 segundos..."
            sleep 10
          done
          if [ -z "$PREVIEW_URL" ]; then
            echo "::warning::URL de previa da Vercel nao foi disponibilizada a tempo. Pulando auditoria do Lighthouse CI."
          fi

      - name: Run Lighthouse CI
        if: steps.wait_preview.outputs.preview_url != ''
        run: |
          pnpm dlx @lhci/cli@0.14.0 autorun --collect.url="${{ steps.wait_preview.outputs.preview_url }}"
